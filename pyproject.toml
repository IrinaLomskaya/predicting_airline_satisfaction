[tool.poetry]
name = "airline-ml"
version = "0.1.0"
description = "Kaggle competition project with MLflow experiment tracking"
authors = ["IrinaLomskaya <is.lomskaya@gmail.com>"]
readme = "README.md"
packages = [{ include = "airline_ml", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
pandas = "^3.0.6"
scikit-learn = "^1.9.1"
kagglehub = "^1.0.2"
mlflow = "^3.16.1"
pyyaml = "^6.0.3"

[tool.poetry.group.dev.dependencies]
jupyterlab = "^4.6.4"
ipykernel = "^7.4.0"
matplotlib = "^3.11.2"
seaborn = "^0.13.2"
pytest = "^9.1.1"
ruff = "^0.16.10"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
